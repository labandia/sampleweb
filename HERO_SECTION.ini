       Hero Section
        .hero {
            padding-top:2em;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 17% 77%, rgba(17, 17, 17, 0.04) 0%, 
                rgba(17, 17, 17, 0.04) 50%, 
                rgba(197, 197, 197, 0.04) 50%, 
                rgba(197, 197, 197, 0.04) 100%), 
                radial-gradient(circle at 26% 17%, rgba(64, 64, 64, 0.04) 0%, 
                rgba(64, 64, 64, 0.04) 50%, 
                rgba(244, 244, 244, 0.04) 50%, 
                rgba(244, 244, 244, 0.04) 100%), 
                radial-gradient(circle at 44% 60%, rgba(177, 177, 177, 0.04) 0%, 
                rgba(177, 177, 177, 0.04) 50%, 
                rgba(187, 187, 187, 0.04) 50%, 
                rgba(187, 187, 187, 0.04) 100%), 
                linear-gradient(19deg, hsl(178, 97%, 24%), #04928f);
            background-size: cover;
            background-position: center;
            overflow: hidden;
            position: relative;
        }
        .hero::before{
             content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
        }

        .hero-container {
            height: calc(100vh - 1rem);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            z-index: 100;

        }

         .hero-actions {
        display: flex;
        flex-direction: row;
        gap: 15px;
        flex-wrap: nowrap;
    }

        .hero-content{
            z-index: 100;
        }

        .hero-content h1 {
            /* font-size: 48px; */
            font-size: 40px;
            line-height: 1.3;
            margin-bottom: 20px;
            color: #fff;
        }

        .hero-content h1 span {
            color: var(--primary);
        }

        .hero-content p {
            font-size: 16px;
            color: #f0fdf4;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .hero-image {
            position: relative;
            text-align: center;
        }

        .hero-image #floatImage {
            /* width: 100%; */
            width: 70%;
            max-width: 500px;
            border-radius: var(--radius);
            /* box-shadow: var(--shadow); */
            animation: float 6s ease-in-out infinite;
        }